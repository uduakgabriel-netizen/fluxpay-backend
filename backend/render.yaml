services:
  - type: web
    name: fluxpay-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fluxpay-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://fluxpay-frontend.vercel.app
      - key: FLUXPAY_CHECKOUT_URL
        value: https://fluxpay-frontend.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@fluxpay.io
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_RPC_PRIMARY
        value: https://api.devnet.solana.com
      - key: JUPITER_API_URL
        value: https://quote-api.jup.ag/v6
      - key: USE_MOCK_PROVIDERS
        value: "true"

databases:
  - name: fluxpay-db
    plan: free
    region: oregon
