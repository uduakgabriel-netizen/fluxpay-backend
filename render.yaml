services:
  - type: web
    name: fluxpay-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fluxpay-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://fluxpay-frontend.vercel.app
      - key: FLUXPAY_CHECKOUT_URL
        value: https://fluxpay-frontend.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@fluxpay.io
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_RPC_PRIMARY
        value: https://api.devnet.solana.com
      - key: JUPITER_API_URL
        value: https://api.jup.ag/swap/v1
      - key: JUPITER_API_KEY
        value: jup_403a0194733904425080cf0e587c7eda66b1a430bc1fc8698f5e76c2d2b4c79d
      - key: REDIS_URL
        value: redis://default:gQAAAAAAAzAcAAIgcDE4Mjk1MGRkMzI2Njc0MzNiODZhNDk4OTJmZDI0ZGZlYg@amusing-crow-208924.upstash.io:6379
      - key: USE_MOCK_PROVIDERS
        value: "true"

databases:
  - name: fluxpay-db
    plan: free
    region: oregon
